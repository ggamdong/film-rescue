<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘도 크랭크인!</title>
<meta name="description" content="오늘도 크랭크인! 망해 가는 한국 영화의 제작자가 되어 14번의 위기를 넘기고 개봉까지 가 보세요. 끝에는 관객 수와 한 줄 운명이 남습니다.">
<meta property="og:title" content="오늘도 크랭크인!">
<meta property="og:description" content="기획부터 개봉까지 14번의 위기. 당신의 영화는 몇 명이 볼까?">
<meta property="og:url" content="https://ggamdong.github.io/film-rescue/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://ggamdong.github.io/film-rescue/img/og.webp">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0e0f13">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<style>
:root{
  --bg:#0e0f13; --bg2:#15171e; --panel:#1b1e27; --line:#2a2e3a;
  --fg:#e9e6df; --mute:#8d8f9a; --accent:#f2b134; --accent2:#e4572e;
  --ok:#62c370; --bad:#e4572e; --mid:#f2b134;
  --budget:#62c370; --schedule:#4fa3e0; --morale:#e58fd1; --quality:#f2b134; --buzz:#ff7a59;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
input{font:inherit}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.screen{display:none}.screen.on{display:block}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}
.mute{color:var(--mute)}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left;transition:transform .08s,background .15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);color:#1a1405;font-weight:700;text-align:center;border-color:transparent}
.btn.ghost{text-align:center;color:var(--mute)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{position:relative;text-align:left;padding:14px 14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-height:112px;transition:transform .08s}
.mode:active{transform:scale(.985)}
.mode.primary{background:var(--accent);color:#1a1405;border-color:transparent}
.mode .mt{font-weight:800;font-size:16px}
.mode .mt span{font-weight:500;font-size:12px;opacity:.7;margin-left:2px}
.mode .ms{font-size:12px;margin-top:6px;opacity:.8;line-height:1.4}
.mode .mb{position:absolute;top:10px;right:10px;font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.25);display:none}
.mode .mb.on{display:block}
.mode:has(.mb.on) .mt{padding-right:56px}
@media (max-width:360px){.modes{grid-template-columns:1fr}.mode{min-height:0}}
.stats-panel{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);display:none}
.stats-panel.on{display:block}
.stats-panel .h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mute)}
.stats-panel .h b{color:var(--fg);font-size:13px}
.stats-panel .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.stats-panel .kv div{text-align:center;background:var(--panel);border-radius:8px;padding:6px 4px}
.stats-panel .kv .l{font-size:10px;color:var(--mute)}
.stats-panel .kv .v{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.dex{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:10px}
.dex div{aspect-ratio:1;border-radius:8px;background:var(--panel);display:grid;place-items:center;font-size:18px;position:relative}
.dex div.off{opacity:.3;filter:grayscale(1)}
.dex div.off::after{content:"?";position:absolute;font-size:13px;color:var(--fg);opacity:.9}
.dex div.off span{visibility:hidden}
.dex div small{position:absolute;right:2px;bottom:1px;font-size:9px;color:var(--mute)}
.ticket .newend{margin-top:8px;font-size:12px;color:#8a5a00;background:#f7e2a6;border-radius:6px;padding:4px 8px;display:inline-block}
.row{display:flex;gap:8px}.row .btn{flex:1}
.stack>*+*{margin-top:10px}

/* title */
.logo{padding:36px 0 8px;text-align:center}
.logo .tag{font-size:12px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase}
.logo h1{font-size:40px;font-weight:900;margin-top:6px}
.logo h1 small{display:block;font-size:14px;font-weight:400;color:var(--mute);letter-spacing:0;margin-top:6px}
.cover{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#23263a,#0e0f13);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute);font-size:13px;margin:12px 0}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.field label{display:block;font-size:12px;color:var(--mute);margin:14px 0 6px}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);outline:none}
.field input:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px}
.chip.on{background:var(--accent);color:#1a1405;border-color:transparent;font-weight:700}
.chip small{color:inherit;opacity:.7;margin-left:4px;font-size:11px}
.howto{font-size:13px;color:var(--mute);margin:18px 0 0;padding:10px 14px;border:1px dashed var(--line);border-radius:12px;list-style:none}
.howto li{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:5px 0;align-items:baseline}
.howto b{color:var(--fg);white-space:nowrap}
@media (max-width:360px){.howto li{grid-template-columns:1fr}}

/* game */
.top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:10px}
.top .film{font-weight:700;color:var(--fg);max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stages{display:flex;gap:4px;margin-bottom:12px}
.stages i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.stages i.done{background:var(--accent);opacity:.5}.stages i.now{background:var(--accent)}
.stages i.gap{margin-left:8px}
.top b{color:var(--accent);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 6px 7px;text-align:center;position:relative;overflow:hidden}
.stat .l{font-size:11px;color:var(--mute)}
.stat .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.stat .bar i{display:block;height:100%;width:0;transition:width .5s ease}
.stat.danger{border-color:var(--bad)}.stat.danger .v{color:var(--bad)}
.stat .d{position:absolute;top:4px;right:6px;font-size:11px;font-weight:800;opacity:0;transform:translateY(4px);transition:all .3s}
.stat .d.show{opacity:1;transform:none}
.stat .d.up{color:var(--ok)}.stat .d.down{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card .img{aspect-ratio:16/9;background:linear-gradient(135deg,#2b2f44,#161820);position:relative;display:grid;place-items:center}
.card .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .img .ph{font-size:40px;opacity:.5}
.card .body{padding:16px}
.card .stage.chance{color:#e58fd1;border-color:#e58fd1;margin-left:6px}
.card .stage{display:inline-block;font-size:11px;letter-spacing:.15em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 8px;margin-bottom:8px}
.card h2{font-size:21px;font-weight:800}
.card p.desc{margin:8px 0 0;color:#cfcdc6;font-size:15px}
.choices{padding:0 16px 16px}
.choices .btn{margin-top:8px;font-size:15px}
.choices .btn::before{content:"▸ ";color:var(--accent)}
.outcome{padding:0 16px 16px;animation:in .3s ease}
.outcome .picked{font-size:12px;color:var(--mute);margin-bottom:6px}
.outcome .txt{font-size:15px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--bg2);border-radius:0 10px 10px 0}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.deltas span{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.deltas span.up{color:var(--ok)}.deltas span.down{color:var(--bad)}
.hint{font-size:12px;color:var(--mute);text-align:center;margin-top:10px}

/* result ticket */
.ticket{background:#f4efe4;color:#1b1a17;border-radius:16px;overflow:hidden;position:relative;animation:in .4s ease}
.ticket .eimg{aspect-ratio:4/3;background:linear-gradient(135deg,#2b2f44,#161820);position:relative;display:grid;place-items:center;color:#8d8f9a}
.ticket .eimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ticket .eimg .ph{font-size:56px;opacity:.6}
.ticket .head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:11px;letter-spacing:.12em;color:#6b665c;border-bottom:1px dashed #cfc7b6}
.ticket .main{padding:16px}
.ticket .film{font-size:22px;font-weight:900;letter-spacing:-.02em}
.ticket .film small{display:block;font-size:12px;font-weight:500;color:#6b665c;margin-top:2px}
.ticket .aud{margin:14px 0 4px;font-size:13px;color:#6b665c}
.ticket .num{font-size:42px;font-weight:900;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.ticket .num small{font-size:16px;font-weight:700;margin-left:4px}
.ticket .fate{margin-top:12px;font-size:17px;font-weight:800;padding:10px 12px;background:#1b1a17;color:#f4efe4;border-radius:8px}
.ticket .fate b{color:var(--accent);font-weight:800;margin-right:6px}
.ticket .crit{margin-top:10px;font-size:14px;color:#3b3833;font-style:italic}
.ticket .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.ticket .kpi>div{background:#e9e2d3;border-radius:8px;padding:8px 6px;text-align:center}
.ticket .kpi .l{font-size:10px;color:#6b665c}
.ticket .kpi .v{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.ticket .kpi .v.ok{color:#2d7a3a}.ticket .kpi .v.bad{color:#b4321f}
.ticket .kpi .s{font-size:10px;color:#6b665c;margin-top:2px}
.ticket .bep{margin-top:14px;font-size:12px;color:#6b665c}
.ticket .bep .bar{height:8px;border-radius:4px;background:#ddd5c3;margin-top:4px;overflow:hidden}
.ticket .bep .bar i{display:block;height:100%;background:#1b1a17}
.ticket .tear{border-top:2px dashed #cfc7b6;position:relative;margin:4px 0}
.ticket .tear::before,.ticket .tear::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.ticket .tear::before{left:-9px}.ticket .tear::after{right:-9px}
.ticket .foot{padding:12px 16px 16px;font-size:12px;color:#3b3833}
.ticket .tstats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.ticket .tstats div{text-align:center}
.ticket .tstats .l{font-size:10px;color:#6b665c}
.ticket .tstats .v{font-weight:800;font-size:15px}
.ticket .tstats .bar{height:4px;background:#ddd5c3;border-radius:2px;margin-top:3px;overflow:hidden}
.ticket .tstats .bar i{display:block;height:100%}
.ticket .emo{font-size:18px;letter-spacing:1px;word-break:break-all}
.ticket .flags{margin-top:8px;color:#6b665c}
.ticket .seed{font-size:11px;color:#6b665c;margin-top:8px}
.actions{margin-top:14px}
.lb{margin-top:12px}
.lb:empty{display:none}
.lb .lbh{font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
.lb .lbh span{font-size:11px;color:var(--mute);font-weight:500}
.lb .lbme{margin-top:6px;font-size:14px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.lb .lbme b{color:var(--accent)}
.lb .lbtop{list-style:none;margin:8px 0 0;padding:0;font-size:12px;color:var(--mute)}
.lb .lbtop li{display:flex;justify-content:space-between;padding:3px 2px}
.lb .lbtop b{color:var(--fg);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#000;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
.footer{text-align:center;font-size:11px;color:var(--mute);margin:26px 0 10px}
.footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">

<!-- ===== 타이틀 ===== -->
<section id="s-title" class="screen on">
  <div class="logo">
    <div class="tag">Crank In!</div>
    <h1>오늘도 크랭크인!<small>크랭크인은 했다. 개봉은 글쎄.</small></h1>
  </div>
  <div class="cover" id="cover"><span style="font-size:48px;opacity:.5">🎬</span></div>
  <div class="field">
    <label>영화 제목 <button class="mute" id="reroll" style="float:right;font-size:12px">🎲 다른 제목</button></label>
    <input id="title-in" maxlength="20" placeholder="제목을 입력하세요">
  </div>
  <div class="field">
    <label>장르 <span class="mute" id="genre-note"></span></label>
    <div class="chips" id="genres"></div>
  </div>
  <div class="modes" style="margin-top:18px">
    <button class="mode" id="start-daily">
      <div class="mt">📅 오늘의 영화 <span id="daily-tag"></span></div>
      <div class="ms">오늘은 전국 제작자가 같은 덱을 받습니다. 누가 덜 망하나 겨뤄 보세요.</div>
      <div class="mb" id="daily-badge"></div>
    </button>
    <button class="mode" id="start-random">
      <div class="mt">🎲 무작위 영화</div>
      <div class="ms">매번 새 대본, 새 사고, 새 운. 망해도 또 찍으면 됩니다.</div>
    </button>
  </div>
  <div class="stats-panel" id="my-stats"></div>
  <ul class="howto">
    <li><b>예산 · 일정 · 사기</b><span>하나라도 0이 되면 그 자리에서 영화는 끝.</span></li>
    <li><b>완성도 · 화제성</b><span>바닥을 쳐도 영화는 나온다. 어떤 영화가 되느냐가 문제일 뿐.</span></li>
    <li><b>14턴 뒤</b><span>관객 수와 한 줄 운명이 적힌 성적표. 복사해서 자랑하거나 숨기거나.</span></li>
  </ul>
  <div class="footer">실존 인물·회사와 무관한 허구입니다 · <a id="ver"></a></div>
</section>

<!-- ===== 게임 ===== -->
<section id="s-game" class="screen">
  <div class="top"><div class="film" id="g-film"></div><div id="g-turn"></div></div>
  <div class="stages" id="g-stages"></div>
  <div class="stats" id="g-stats"></div>
  <div class="card" id="g-card"></div>
  <div class="hint" id="g-hint"></div>
</section>

<!-- ===== 결과 ===== -->
<section id="s-result" class="screen">
  <div class="ticket" id="ticket"></div>
  <div class="lb" id="lb"></div>
  <div class="actions stack">
    <button class="btn primary" id="copy">📋 결과 복사하기</button>
    <div class="row">
      <button class="btn" id="save-img" style="text-align:center">🖼 이미지 저장</button>
      <button class="btn" id="share" style="text-align:center">🔗 공유</button>
    </div>
    <button class="btn primary" id="again-new">🎲 새 영화 만들기 <span style="font-weight:500;opacity:.75;font-size:13px">— 다른 카드, 다른 운</span></button>
    <div class="row">
      <button class="btn ghost" id="again-same">같은 덱으로 다시</button>
      <button class="btn ghost" id="again-home">처음으로</button>
    </div>
  </div>
  <div class="footer">실존 인물·회사와 무관한 허구입니다</div>
</section>

</div>
<div class="toast" id="toast"></div>
<canvas id="cv" width="1080" height="1350" style="display:none"></canvas>

<script src="cards.js"></script>
<!-- 방문·이벤트 집계 (GoatCounter, 무료). 계정을 만들고 아래 data-goatcounter 의 사이트 코드를 바꾸면 켜진다. 비워 두면 아무것도 보내지 않는다. -->
<script data-goatcounter="https://ggamdong.goatcounter.com/count" async src="https://gc.zgo.at/count.js" data-goatcounter-settings='{"no_onload": false, "allow_local": false}' id="gc"></script>
<script>(function(){var g=document.getElementById("gc");if(!g.getAttribute("data-goatcounter"))g.remove();})();</script>
<script>
/* CORE-START : 순수 게임 로직. DOM을 쓰지 않으며 tools/simulate.mjs가 이 구간을 그대로 읽어 실행한다. */
const FR = (() => {
  const VERSION = "0.1.0";
  const STATS = { budget: "예산", schedule: "일정", morale: "사기", quality: "완성도", buzz: "화제성" };
  const STAT_KEYS = Object.keys(STATS);
  const SURVIVAL = ["budget", "schedule", "morale"];          // 0이 되면 즉시 종료
  const STAGES = [ // phase: 프리프로덕션(6턴) → 프로덕션(3) → 포스트프로덕션(2) → 개봉 직전(2) → 개봉(1)
    { key: "planning",  name: "기획",   turns: 2, phase: "프리프로덕션" },
    { key: "funding",   name: "투자",   turns: 2, phase: "프리프로덕션" },
    { key: "casting",   name: "캐스팅", turns: 2, phase: "프리프로덕션" },
    { key: "shooting",  name: "촬영",   turns: 3, phase: "프로덕션" },
    { key: "post",      name: "후반",   turns: 2, phase: "포스트프로덕션" },
    { key: "marketing", name: "마케팅", turns: 2, phase: "개봉 직전" },
    { key: "release",   name: "개봉",   turns: 1, phase: "개봉" },
  ];
  const TOTAL_TURNS = STAGES.reduce((a, s) => a + s.turns, 0);
  const START = { budget: 50, schedule: 55, morale: 60, quality: 40, buzz: 15 };
  const BURN = { budget: -1, schedule: -1 };                   // 매 턴 자동 소모: 돈과 시간은 가만히 있어도 줄어든다
  const GENRES = [
    { key: "thriller", name: "범죄 스릴러",   fx: { quality: 5,  budget: -5 },                 note: "완성도 +5, 예산 -5" },

  function start(seed, isDaily) {

    st = FR.newGame({ seed, cards: CARDS, title: $("#title-in").value, genre });
    st.isDaily = !!isDaily;
    end = null;
    $("#g-film").textContent = `《${st.film.title}》 ${st.film.genreName}`;
    show("s-game"); renderStats(); renderTurn();
  }
  // 저장된 선택을 그대로 재생해 결과 화면을 복원한다
  function replay(rec) {
    st = FR.newGame({ seed: rec.seed, cards: CARDS, title: rec.title, genre: rec.genre });
    st.isDaily = true; st.replayed = true;
    for (const i of rec.choices) { if (FR.isFinished(st)) break; FR.drawCard(st); FR.choose(st, i); FR.nextTurn(st); }
    showResult();
  }

  // ----- 이미지 (없으면 자리만) -----
  function loadImg(box, candidates, ph) {
    box.innerHTML = ph ? `<span class="ph">${ph}</span>` : box.innerHTML;
    const img = new Image(); let i = 0;
    img.onload = () => { box.innerHTML = ""; box.appendChild(img); box.dataset.src = img.src; };
    img.onerror = () => { if (++i < candidates.length) img.src = candidates[i]; };
    img.src = candidates[0];
  }

  // ----- 게임 화면 -----
  function renderStats(deltas) {
    const box = $("#g-stats"); box.innerHTML = "";
    FR.STAT_KEYS.forEach((k) => {
      const v = st.stats[k], danger = FR.SURVIVAL.includes(k) && v <= 20, d = deltas && deltas[k];
      const el = document.createElement("div"); el.className = "stat" + (danger ? " danger" : "");
      el.innerHTML = `<div class="l">${FR.STATS[k]}${FR.SURVIVAL.includes(k) ? "" : " ·"}</div><div class="v">${v}</div><div class="bar"><i style="background:var(--${k})"></i></div>${d ? `<div class="d ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : ""}${d}</div>` : ""}`;
      box.appendChild(el);
      requestAnimationFrame(() => { el.querySelector(".bar i").style.width = v + "%"; const dd = el.querySelector(".d"); if (dd) setTimeout(() => dd.classList.add("show"), 50); });
    });
  }
  function renderTurn() {
    const stage = FR.stageOf(st);
    $("#g-turn").innerHTML = `<b>${stage.phase}</b> · ${stage.name} · ${st.turn + 1}/${FR.TOTAL_TURNS}턴`;
    $("#g-stages").innerHTML = st.plan.map((k, i) => { const ph = FR.STAGES.find((x) => x.key === k).phase, prev = i > 0 ? FR.STAGES.find((x) => x.key === st.plan[i - 1]).phase : ph; return `<i class="${i < st.turn ? "done" : i === st.turn ? "now" : ""}${ph !== prev ? " gap" : ""}"></i>`; }).join("");
    const card = FR.drawCard(st);
    const box = $("#g-card");
    box.innerHTML = `<div class="img"></div><div class="body"><span class="stage">${stage.name}</span>${card.type === "chance" ? `<span class="stage chance">✨ 기회</span>` : ""}<h2>${esc(card.title)}</h2><p class="desc">${esc(card.desc)}</p></div><div class="choices"></div>`;
    loadImg(box.querySelector(".img"), [`img/cards/${card.id}.webp`, `img/stages/${card.stage}.webp`], stageEmoji(card.stage));
    const ch = box.querySelector(".choices");
    card.choices.forEach((c, i) => { const b = document.createElement("button"); b.className = "btn"; b.textContent = c.text; b.onclick = () => onChoose(i); ch.appendChild(b); });
    $("#g-hint").textContent = FR.SURVIVAL.some((k) => st.stats[k] <= 20) ? "⚠ 생존 수치가 위험합니다" : "";
  }
  const stageEmoji = (s) => ({ planning: "📝", funding: "💼", casting: "🎭", shooting: "🎥", post: "✂️", marketing: "📣", release: "🎟" }[s] || "🎬");
  function onChoose(i) {
    const card = st.card, r = FR.choose(st, i);
    renderStats(r.deltas);
    const box = $("#g-card"); box.querySelector(".choices").remove();
    const o = document.createElement("div"); o.className = "outcome";
    const chips = Object.entries(r.deltas).map(([k, d]) => `<span class="${d > 0 ? "up" : "down"}">${FR.STATS[k]} ${d > 0 ? "+" : ""}${d}</span>`).join("") || `<span>변화 없음</span>`;
    o.innerHTML = `<div class="picked">▸ ${esc(r.choice.text)}</div><div class="txt">${esc(r.outcome.text)}</div><div class="deltas">${chips}</div>`;
    const b = document.createElement("button"); b.className = "btn primary";
    const done = st.over || st.turn + 1 >= FR.TOTAL_TURNS;
    b.textContent = st.over ? "결과 보기" : done ? "개봉 성적 확인" : "다음 →";
    b.onclick = () => { FR.nextTurn(st); if (FR.isFinished(st)) showResult(); else renderTurn(); };
    o.appendChild(b); box.appendChild(o);
    if (st.over) toast({ budget: "예산이 바닥났습니다", morale: "현장이 무너졌습니다", schedule: "일정이 완전히 무너졌습니다" }[st.over]);
  }

  // ----- 결과 -----
  function showResult() {
    end = FR.finish(st);
    const t = $("#ticket");
    const aud = st.over ? `<div class="num" style="font-size:30px">${end.label}</div><div class="mute" style="font-size:12px;color:#6b665c">${st.turn}턴 · ${FR.stageOf({ plan: st.plan, turn: Math.min(st.turn - 1, FR.TOTAL_TURNS - 1) }).name} 단계에서 종료</div>`
      : end.tier === "ott" ? `<div class="num">OTT 직행</div><div style="font-size:12px;color:#6b665c">극장 관객 0명 · 제작비 회수 110%</div>`
      : `<div class="num">${end.audience.toLocaleString("ko-KR")}<small>명</small></div>`;
    const bep = st.over || end.tier === "ott" ? "" : `<div class="bep">총제작비 ${end.cost}억 · 손익분기 ${Math.round(end.bep / 10000)}만 명 중 <b>${end.bepPct}%</b><div class="bar"><i style="width:${Math.min(100, end.bepPct)}%"></i></div></div>`;
    const won = (v) => (v >= 0 ? "+" : "−") + Math.abs(v) + "억";
    const kpi = st.over
      ? `<div class="kpi"><div><div class="l">평론 평점</div><div class="v">—</div></div><div><div class="l">관객 평점</div><div class="v">—</div></div><div><div class="l">손익</div><div class="v bad">−${end.cost}억</div><div class="s">제작비 전액 손실</div></div></div>`
      : `<div class="kpi"><div><div class="l">평론 평점</div><div class="v">★ ${end.critics}</div><div class="s">10점 만점</div></div><div><div class="l">관객 평점</div><div class="v">★ ${end.audScore}</div><div class="s">10점 만점</div></div><div><div class="l">손익</div><div class="v ${end.profit >= 0 ? "ok" : "bad"}">${won(end.profit)}</div><div class="s">${end.tier === "ott" ? "선판매로 회수" : end.bepHit ? "손익분기 달성 ✓" : "손익분기 미달 ✗"}</div></div></div>`;
    const flagsKo = end.flags.length ? `<div class="flags">기록: ${end.flags.map(flagName).join(" · ")}</div>` : "";
    t.innerHTML = `<div class="eimg"></div>
      <div class="head"><span>BOX OFFICE REPORT</span><span>통합전산망 (비공식)</span></div>
      <div class="main">
        <div class="film">《${esc(st.film.title)}》<small>${st.film.genreName} · ${st.flags.has("r_rated") ? "청소년 관람불가" : "15세 이상 관람가"} · ${end.label}</small></div>
        <div class="aud">${st.over ? "최종 상태" : "누적 관객"}</div>${aud}
        <div class="fate"><b>운명</b>${esc(end.fate)}</div>
        <div class="crit">“${esc(end.critic)}”</div>${kpi}${bep}
      </div>
      <div class="tear"></div>
      <div class="foot">
        <div class="tstats">${FR.STAT_KEYS.map((k) => `<div><div class="l">${FR.STATS[k]}</div><div class="v">${st.stats[k]}</div><div class="bar"><i style="width:${st.stats[k]}%;background:var(--${k})"></i></div></div>`).join("")}</div>
        <div class="emo">${st.history.map((h) => h.emoji).join("")}</div>${flagsKo}
        <div class="seed">#${st.seed} · 오늘도 크랭크인!</div>
      </div>`;
    loadImg(t.querySelector(".eimg"), [`img/endings/${end.tier}.webp`], tierEmoji(end.tier));
    if (st.isDaily && !loadDaily()) saveDaily({ seed: st.seed, title: st.film.title, genre: st.film.genre, choices: st.history.map((h) => h.choiceIdx) });
    if (!st.replayed) {
      const r = recordStats(st, end);
      if (r.isNewEnding) t.querySelector(".crit").insertAdjacentHTML("afterend", `<div class="newend">🏆 새 엔딩 발견: ${TIER_KO[end.tier]} (도감 ${TIER_ORDER.filter((k) => r.stats.endings[k]).length}/9)</div>`);
      track("finish", end.tier);
    }
    refreshModes(); renderMyStats();
    $("#lb").innerHTML = "";
    end.lb = null;
    if (LEADERBOARD_URL && st.isDaily) {
      const aud = st.over || end.tier === "ott" ? 0 : end.audience;
      (st.replayed ? fetchScore(st.seed, aud) : submitScore(st, end)).then((lb) => { end.lb = lb; renderLb(lb); });
    }
    show("s-result");
  }
  const FLAG_KO = { star: "톱배우 캐스팅", idol: "아이돌 주연", festival: "영화제 경쟁 진출", scandal_star: "주연 논란", scandal_light: "잡음", fake_booking: "예매율 조작 적발", trailer_lie: "예고편 사기 논란", director_replaced: "감독 교체", injury: "촬영 부상", city_scene: "지자체 홍보 장면", family_blessing: "유족 자문", crowd_cameo: "후원자 출연", rival_project: "경쟁작", director_gone: "감독 잠적", connection: "인맥", group_sales: "단체 관람", ott_deal: "OTT 계약", personal_debt: "제작자 개인 빚", revenue_share: "수익 30% 양도", profit_actor: "지분 배우", crypto_money: "코인 투자금", need_star: "선판매 조건", no_stunt: "대역 없는 액션", region_shoot: "지역 촬영 지원", lawsuit_risk: "소송 위험", r_rated: "청불", webtoon_ip: "웹툰 원작", new_investor: "투자사 교체", investor_actor: "투자사 신인", angel_investor: "큰손", local_subsidy: "지자체 지원금", grant: "영상위 지원금", presale: "해외 선판매", crowdfund: "크라우드펀딩", unknown_lead: "무명 주연", two_endings: "엔딩 두 개", tragic_ending: "비극 엔딩", free_vfx: "공짜 VFX", chairman_money: "회장님 투자", patron: "조건 없는 후원", star_control: "톱배우 통제권", ai_dub: "AI 더빙 논란", viral_scam: "바이럴 청구서", scandal_light: "잡음", webtoon_ip: "웹툰 원작" };
  const flagName = (f) => FLAG_KO[f] || f;

  const share = () => FR.shareText(st, end, baseUrl() + "?s=" + st.seed);
  $("#copy").onclick = async () => { track("copy"); try { await navigator.clipboard.writeText(share()); toast("복사했습니다. 어디든 붙여 넣으세요"); } catch { prompt("복사하세요", share()); } };
  $("#share").onclick = async () => { track("share"); const text = share(); if (navigator.share) { try { await navigator.share({ text }); } catch {} } else { try { await navigator.clipboard.writeText(text); toast("복사했습니다"); } catch {} } };
  $("#again-same").onclick = () => start(st.seed, st.isDaily);
  $("#again-new").onclick = () => { $("#title-in").value = FR.suggestTitle(tRng); start(randomSeed(), false); toast("새 덱, 새 제목으로 시작합니다"); };
  $("#again-home").onclick = () => { show("s-title"); };
  $("#save-img").onclick = () => { track("save_img"); drawCanvas(); };

  // 결과 카드 PNG (1080x1350)
  function drawCanvas() {
    const cv = $("#cv"), c = cv.getContext("2d"), W = 1080, H = 1350;
    c.fillStyle = "#0e0f13"; c.fillRect(0, 0, W, H);
    const img = $("#ticket .eimg img");
    const top = 560;
    if (img && img.complete && img.naturalWidth) {
      const s = Math.max(W / img.naturalWidth, top / img.naturalHeight), w = img.naturalWidth * s, h = img.naturalHeight * s;
      c.drawImage(img, (W - w) / 2, (top - h) / 2, w, h);
    } else { const g = c.createLinearGradient(0, 0, W, top); g.addColorStop(0, "#2b2f44"); g.addColorStop(1, "#161820"); c.fillStyle = g; c.fillRect(0, 0, W, top); c.font = "200px serif"; c.textAlign = "center"; c.fillText(tierEmoji(end.tier), W / 2, top / 2 + 70); }
    const gg = c.createLinearGradient(0, top - 200, 0, top); gg.addColorStop(0, "rgba(14,15,19,0)"); gg.addColorStop(1, "#0e0f13"); c.fillStyle = gg; c.fillRect(0, top - 200, W, 200);
    c.textAlign = "left"; const F = '"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif';
    c.fillStyle = "#f2b134"; c.font = `600 26px ${F}`; c.fillText("오늘도 크랭크인!  #" + st.seed, 72, 620);
    c.fillStyle = "#e9e6df"; c.font = `900 64px ${F}`; wrap(c, `《${st.film.title}》`, 72, 700, W - 144, 74);
    c.fillStyle = "#8d8f9a"; c.font = `400 28px ${F}`; c.fillText(`${st.film.genreName} · ${end.label}`, 72, 760);
    c.fillStyle = "#e9e6df"; c.font = `900 110px ${F}`;
    const audTxt = st.over ? end.label : end.tier === "ott" ? "OTT 직행" : end.audience.toLocaleString("ko-KR") + "명";
    c.fillText(audTxt, 72, 890);
    c.fillStyle = "#8d8f9a"; c.font = `400 28px ${F}`; c.fillText(st.over ? `${st.turn}턴 만에 종료` : end.tier === "ott" ? "극장 관객 0명" : `손익분기 ${end.bepPct}%`, 72, 935);
    c.fillStyle = "#f2b134"; c.font = `800 40px ${F}`; wrap(c, "운명: " + end.fate, 72, 1010, W - 144, 50);
    c.fillStyle = "#cfcdc6"; c.font = `italic 400 30px ${F}`; wrap(c, "“" + end.critic + "”", 72, 1100, W - 144, 40);
    c.fillStyle = "#e9e6df"; c.font = `700 30px ${F}`;
    c.fillText(st.over ? `손실 ${end.cost}억 · 미개봉` : `평론 ★${end.critics}   관객 ★${end.audScore}   손익 ${(end.profit >= 0 ? "+" : "−") + Math.abs(end.profit)}억 (${end.tier === "ott" ? "선판매" : end.bepHit ? "BEP 달성" : "BEP 미달"})`, 72, 1160);
    // 스탯 바
    const keys = FR.STAT_KEYS, cols = { budget: "#62c370", schedule: "#4fa3e0", morale: "#e58fd1", quality: "#f2b134", buzz: "#ff7a59" };
    keys.forEach((k, i) => { const x = 72 + i * 190, y = 1200; c.fillStyle = "#8d8f9a"; c.font = `400 22px ${F}`; c.fillText(FR.STATS[k], x, y); c.fillStyle = "#e9e6df"; c.font = `800 34px ${F}`; c.fillText(st.stats[k], x, y + 40); c.fillStyle = "#2a2e3a"; c.fillRect(x, y + 56, 150, 8); c.fillStyle = cols[k]; c.fillRect(x, y + 56, 150 * st.stats[k] / 100, 8); });
    c.fillStyle = "#e9e6df"; c.font = `400 34px serif`; c.fillText(st.history.map((h) => h.emoji).join(""), 72, 1310);
    c.fillStyle = "#8d8f9a"; c.font = `400 22px ${F}`; c.textAlign = "right"; c.fillText(baseUrl().replace(/^https?:\/\//, ""), W - 72, 1310); c.textAlign = "left";
    try {
      const a = document.createElement("a"); a.download = `film-rescue-${st.seed}.png`; a.href = cv.toDataURL("image/png"); a.click(); toast("이미지를 저장했습니다");
    } catch { toast("이미지 저장에 실패했습니다"); }
  }
  function wrap(c, text, x, y, maxW, lh) { let line = "", yy = y; for (const ch of text) { const t = line + ch; if (c.measureText(t).width > maxW && line) { c.fillText(line, x, yy); line = ch; yy += lh; } else line = t; } c.fillText(line, x, yy); return yy; }
})();
</script>
